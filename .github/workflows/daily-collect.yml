name: 웹소설 랭킹 매일 수집

on:
  schedule:
    # 매일 한국시간(KST) 오전 7시 = UTC 22시(전날)
    - cron: "0 22 * * *"
  workflow_dispatch: {} # 수동 실행 버튼도 활성화

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설정
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 의존성 설치
        run: npm install

      - name: 랭킹 수집 실행
        env:
          KAKAO_RANKING_API_URL: ${{ secrets.KAKAO_RANKING_API_URL }}
        run: npm run collect

      - name: 결과 CSV 커밋
        run: |
          git config user.name "webnovel-ranking-bot"
          git config user.email "actions@users.noreply.github.com"
          git add output/
          git diff --cached --quiet || git commit -m "chore: 랭킹 데이터 자동 수집 $(date -u +'%Y-%m-%d')"
          git push
