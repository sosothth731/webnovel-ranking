<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>웹소설 랭킹 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Pretendard&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --text: #33313B;
    --text-muted: #8B8894;
    --surface: rgba(255,255,255,0.86);
    --surface-solid: #FFFFFF;
    --hairline: rgba(51,49,59,0.08);
    --accent: #8D86CE;
    --accent-soft: rgba(141,134,206,0.14);
    --shadow: 0 8px 24px rgba(80,60,110,0.08);

    --kakao-tint: #FCEBBE;
    --kakao-text: #8A6A16;
    --kakao-head: #EFCE7C;

    --ridi-tint: #DBE9F6;
    --ridi-text: #2C5C82;
    --ridi-head: #85B4D6;

    --naver-tint: #DEEFDF;
    --naver-text: #3A6B45;
    --naver-head: #8ECC98;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
    background:
      radial-gradient(circle at 8% 8%, #FBE7EF 0%, transparent 42%),
      radial-gradient(circle at 92% 15%, #E3ECFB 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, #EDE8FA 0%, transparent 50%),
      #F7F5FA;
    background-attachment: fixed;
  }
  a{ color: inherit; text-decoration: none; }

  .page{ max-width: 1180px; margin: 0 auto; padding: 36px 24px 80px; }

  header.topbar{
    display:flex; align-items:center; gap:16px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-icon{
    width:38px; height:38px; border-radius: 11px;
    background: linear-gradient(135deg, #A79EE8, #8D86CE);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:17px; flex-shrink:0;
    box-shadow: var(--shadow);
  }
  .brand-title{ font-family:"Manrope",sans-serif; font-weight: 800; font-size: 19px; }
  .brand-sub{ font-size: 12px; color: var(--text-muted); }

  .search-box{
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 10px 16px; min-width: 240px;
    box-shadow: var(--shadow);
  }
  .search-box input{
    border:0; background:none; outline:none; font-size:13.5px; color:var(--text);
    width:100%; font-family: inherit;
  }
  .search-box input::placeholder{ color: var(--text-muted); }
  .search-box svg{ flex-shrink:0; color: var(--text-muted); }

  .date-row{
    display:flex; align-items:center; gap:14px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .date-label{ font-size: 13.5px; color: var(--text-muted); }
  .date-label b{ color: var(--text); font-weight:700; }
  .date-pills{ display:flex; gap:4px; background: var(--surface); border:1px solid var(--hairline); border-radius:999px; padding:4px; box-shadow: var(--shadow); }
  .pill{
    font-size:12.5px; font-family: inherit; border:none; background:transparent;
    color: var(--text-muted); padding:6px 13px; border-radius:999px; cursor:pointer; white-space:nowrap;
  }
  .pill:hover{ color: var(--text); }
  .pill.active{ background: var(--accent); color:#fff; font-weight:700; }

  .board{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px){ .board{ grid-template-columns: 1fr; } }

  .column-head{
    display:flex; align-items:center; gap:9px; margin-bottom:14px; padding: 0 4px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.kakao{ background: var(--kakao-head); }
  .dot.ridi{ background: var(--ridi-head); }
  .dot.naver{ background: var(--naver-head); }
  .column-title{ font-weight:700; font-size:14.5px; }
  .column-count{
    margin-left:auto; font-size:11.5px; color: var(--text-muted);
    background: var(--surface); border:1px solid var(--hairline);
    padding: 2px 9px; border-radius: 999px;
  }

  .card-list{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background: var(--surface-solid);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 14px 15px;
    box-shadow: var(--shadow);
  }
  .card-top{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .rank-badge{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family:"Manrope",sans-serif; font-weight:800; font-size:12px;
    flex-shrink:0; color: var(--text);
  }
  .rank-badge.kakao{ background: var(--kakao-tint); color: var(--kakao-text); }
  .rank-badge.ridi{ background: var(--ridi-tint); color: var(--ridi-text); }
  .rank-badge.naver{ background: var(--naver-tint); color: var(--naver-text); }
  .card-launch{ margin-left:auto; font-size:10.5px; color: var(--text-muted); white-space:nowrap; }

  .card-title{
    font-weight:700; font-size:14.5px; margin-bottom:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-title:hover{ color: var(--accent); }
  .card-author{ font-size:12px; color: var(--text-muted); margin-bottom:10px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 10px; }
  .chip{ font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .chip.kakao{ background: var(--kakao-tint); color: var(--kakao-text); }
  .chip.ridi{ background: var(--ridi-tint); color: var(--ridi-text); }
  .chip.naver{ background: var(--naver-tint); color: var(--naver-text); }

  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 9px; border-top: 1px solid var(--hairline);
  }
  .metric-value{ font-family:"Manrope",sans-serif; font-weight:800; font-size:13.5px; }
  .metric-type{ font-size:10.5px; color: var(--text-muted); }

  .empty-col{
    border: 1.5px dashed var(--hairline); border-radius:18px; padding: 34px 16px;
    text-align:center; font-size:12.5px; color: var(--text-muted); background: rgba(255,255,255,0.4);
  }
  .empty-state{
    grid-column: 1 / -1;
    border: 1.5px dashed var(--hairline); border-radius:18px; padding: 60px 24px;
    text-align:center; font-size:14px; color: var(--text-muted); background: rgba(255,255,255,0.5);
  }
  .empty-state code{
    background: var(--accent-soft); padding:2px 6px; border-radius:4px; font-size:12.5px;
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }
</style>
</head>
<body>
<div class="page">

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">📖</div>
      <div>
        <div class="brand-title">웹소설 랭킹 보드</div>
        <div class="brand-sub">카카오페이지 · 리디북스 · 네이버시리즈 로맨스 TOP15</div>
      </div>
    </div>
    <div class="search-box">
      <svg width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M13.28 8.18a5.1 5.1 0 1 1-10.2 0 5.1 5.1 0 0 1 10.2 0m-1.031 5.069a6.5 6.5 0 1 1 .991-.989l4.695 4.695a.7.7 0 1 1-.99.99z" fill="currentColor"/>
      </svg>
      <input type="text" id="searchInput" placeholder="작품명 · 작가명 · 키워드 검색">
    </div>
  </header>

  <div class="date-row">
    <span class="date-label" id="dateLabel">불러오는 중…</span>
    <div class="date-pills" id="dateTabs"></div>
  </div>

  <div id="boardWrap"></div>

</div>

<script>
const CSV_PATH = "output/webnovel_ranking.csv";
const PLATFORMS = [
  { name: "카카오페이지", cls: "kakao" },
  { name: "리디북스", cls: "ridi" },
  { name: "네이버시리즈", cls: "naver" }
];

let allRows = [];
let dateValues = [];
let state = { date: null, query: "" };

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatDateLabel(dateStr){
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00+09:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

function renderDateTabs(){
  const container = document.getElementById("dateTabs");
  container.innerHTML = "";
  dateValues.forEach((v) => {
    const btn = document.createElement("button");
    btn.className = "pill" + (v === state.date ? " active" : "");
    btn.textContent = v.slice(5).replace("-", "/");
    btn.addEventListener("click", () => {
      state.date = v;
      renderDateTabs();
      renderBoard();
    });
    container.appendChild(btn);
  });
  document.getElementById("dateLabel").innerHTML = state.date
    ? `오늘은 <b>${formatDateLabel(state.date)}</b>`
    : "";
}

function cardHtml(r, cls){
  const rank = Number(r["순위"]);
  const url = r["URL"] || "#";
  const keywords = (r["키워드"] || "").split(/\s+/).filter(Boolean).slice(0, 3);
  const chipRow = keywords.length
    ? `<div class="chip-row">${keywords.map((k) => `<span class="chip ${cls}">${escapeHtml(k)}</span>`).join("")}</div>`
    : "";

  return `
    <div class="card">
      <div class="card-top">
        <div class="rank-badge ${cls}">${rank}</div>
        <div class="card-launch">${escapeHtml(r["론칭일"]) || "론칭일 미상"}</div>
      </div>
      <a class="card-title" href="${escapeHtml(url)}" target="_blank" rel="noopener">${escapeHtml(r["작품명"])}</a>
      <div class="card-author">${escapeHtml(r["작가명"]) || "작가 미상"}</div>
      ${chipRow}
      <div class="card-footer">
        <span class="metric-value">${escapeHtml(r["지표값"]) || "—"}</span>
        <span class="metric-type">${escapeHtml(r["지표종류"])}</span>
      </div>
    </div>`;
}

function renderBoard(){
  const wrap = document.getElementById("boardWrap");

  if (!allRows.length){
    wrap.innerHTML = `
      <div class="board">
        <div class="empty-state">
          아직 표시할 데이터가 없습니다.<br>
          저장소에 <code>${CSV_PATH}</code> 파일이 있는지 확인해주세요.<br>
          (GitHub Actions가 최소 한 번은 실행되어야 이 파일이 생깁니다.)
        </div>
      </div>`;
    return;
  }

  const q = state.query.trim().toLowerCase();

  const columns = PLATFORMS.map(({ name, cls }) => {
    let rows = allRows.filter((r) => r["확인날짜"] === state.date && r["플랫폼"] === name);
    if (q){
      rows = rows.filter((r) =>
        (r["작품명"] || "").toLowerCase().includes(q) ||
        (r["작가명"] || "").toLowerCase().includes(q) ||
        (r["키워드"] || "").toLowerCase().includes(q)
      );
    }
    rows.sort((a, b) => Number(a["순위"]) - Number(b["순위"]));

    const body = rows.length
      ? `<div class="card-list">${rows.map((r) => cardHtml(r, cls)).join("")}</div>`
      : `<div class="empty-col">해당 날짜/검색어에 결과가 없습니다</div>`;

    return `
      <div>
        <div class="column-head">
          <span class="dot ${cls}"></span>
          <span class="column-title">${name}</span>
          <span class="column-count">${rows.length}건</span>
        </div>
        ${body}
      </div>`;
  }).join("");

  wrap.innerHTML = `<div class="board">${columns}</div>`;
}

function setup(){
  dateValues = [...new Set(allRows.map((r) => r["확인날짜"]))].sort().reverse();
  state.date = dateValues[0] || null;

  renderDateTabs();

  document.getElementById("searchInput").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderBoard();
  });

  renderBoard();
}

fetch(CSV_PATH)
  .then((res) => {
    if (!res.ok) throw new Error("CSV fetch failed");
    return res.text();
  })
  .then((text) => {
    const parsed = Papa.parse(text, { header: true, skipEmptyLines: true });
    allRows = parsed.data;
    setup();
  })
  .catch(() => {
    allRows = [];
    setup();
  });
</script>
</body>
</html>
