<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>웹소설 랭킹 보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Pretendard&family=IBM+Plex+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --page-bg:
      radial-gradient(circle at 8% 8%, #FBE7EF 0%, transparent 42%),
      radial-gradient(circle at 92% 15%, #E3ECFB 0%, transparent 45%),
      radial-gradient(circle at 50% 100%, #EDE8FA 0%, transparent 50%),
      #F7F5FA;
    --text: #33313B;
    --text-muted: #8B8894;
    --surface: rgba(255,255,255,0.86);
    --surface-solid: #FFFFFF;
    --hairline: rgba(51,49,59,0.08);
    --accent: #8D86CE;
    --accent-soft: rgba(141,134,206,0.14);
    --shadow: 0 8px 24px rgba(80,60,110,0.08);
    --font-num: "Manrope", sans-serif;

    --kakao-tint: #FCEBBE;
    --kakao-text: #8A6A16;
    --kakao-head: #EFCE7C;

    --ridi-tint: #DBE9F6;
    --ridi-text: #2C5C82;
    --ridi-head: #85B4D6;

    --naver-tint: #DEEFDF;
    --naver-text: #3A6B45;
    --naver-head: #8ECC98;
  }

  [data-theme="dark"]{
    --page-bg: #0A0E17;
    --text: #E7EAF3;
    --text-muted: #6B7690;
    --surface: #121826;
    --surface-solid: #121826;
    --hairline: #232B45;
    --accent: #5B8DEF;
    --accent-soft: rgba(91,141,239,0.16);
    --shadow: 0 8px 20px rgba(0,0,0,0.35);
    --font-num: "IBM Plex Mono", monospace;

    --kakao-tint: rgba(240,180,41,0.14);
    --kakao-text: #F0B429;
    --kakao-head: #F0B429;

    --ridi-tint: rgba(34,211,238,0.14);
    --ridi-text: #22D3EE;
    --ridi-head: #22D3EE;

    --naver-tint: rgba(52,211,153,0.14);
    --naver-text: #34D399;
    --naver-head: #34D399;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height: 100vh;
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    line-height: 1.5;
    background: var(--page-bg);
    background-attachment: fixed;
    transition: background 0.2s, color 0.2s;
  }
  a{ color: inherit; text-decoration: none; }

  .page{ max-width: 1180px; margin: 0 auto; padding: 36px 24px 80px; }

  header.topbar{
    display:flex; align-items:center; gap:16px; flex-wrap: wrap;
    margin-bottom: 22px;
  }
  .brand{ display:flex; align-items:center; gap:10px; }
  .brand-icon{
    width:38px; height:38px; border-radius: 11px;
    background: linear-gradient(135deg, #A79EE8, #8D86CE);
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:17px; flex-shrink:0;
    box-shadow: var(--shadow);
  }
  .brand-title{ font-family:"Manrope",sans-serif; font-weight: 800; font-size: 19px; }
  .brand-sub{ font-size: 12px; color: var(--text-muted); }

  .view-nav{
    display:flex; gap:4px; background: var(--surface); border:1px solid var(--hairline);
    border-radius:999px; padding:4px; box-shadow: var(--shadow);
  }
  .view-nav .pill{
    font-size:12.5px; font-weight:600; color: var(--text-muted);
    padding:7px 14px; border-radius:999px; text-decoration:none; white-space:nowrap;
  }
  .view-nav .pill:hover{ color: var(--text); }
  .view-nav .pill.active{ background: var(--accent); color:#fff; }

  .search-box{
    position: relative;
    margin-left:auto; display:flex; align-items:center; gap:8px;
    background: var(--surface); border: 1px solid var(--hairline);
    border-radius: 999px; padding: 10px 16px; min-width: 240px;
    box-shadow: var(--shadow);
  }
  .search-box input{
    border:0; background:none; outline:none; font-size:13.5px; color:var(--text);
    width:100%; font-family: inherit;
  }
  .search-box input::placeholder{ color: var(--text-muted); }
  .search-box svg{ flex-shrink:0; color: var(--text-muted); }

  .search-results{
    position:absolute; top: calc(100% + 8px); left:0; right:0;
    background: var(--surface-solid); border:1px solid var(--hairline); border-radius:16px;
    box-shadow: 0 16px 40px rgba(80,60,110,0.16); padding:6px; z-index:30;
    max-height: 360px; overflow-y: auto;
  }
  .search-result-item{
    display:flex; align-items:center; gap:9px;
    padding:9px 10px; border-radius:11px; cursor:pointer;
    text-align:left; width:100%; background:none; border:none; font-family:inherit;
  }
  .search-result-item:hover, .search-result-item.active{ background: var(--accent-soft); }
  .search-result-item .dot{ flex-shrink:0; }
  .search-result-main{ min-width:0; flex:1; }
  .search-result-title{
    font-size:13px; font-weight:700; color: var(--text);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .search-result-meta{
    font-size:11px; color: var(--text-muted); margin-top:2px;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  }
  .search-result-date{ flex-shrink:0; font-size:10.5px; color: var(--text-muted); white-space:nowrap; }
  .search-result-empty{ padding:14px 10px; font-size:12.5px; color: var(--text-muted); text-align:center; }

  .theme-toggle{
    display:flex; align-items:center; justify-content:center;
    width:38px; height:38px; border-radius:50%; flex-shrink:0;
    background: var(--surface); border:1px solid var(--hairline);
    box-shadow: var(--shadow); cursor:pointer; color: var(--text);
  }
  .theme-toggle:hover{ color: var(--accent); }
  .theme-toggle svg{ display:block; }
  .theme-toggle.active{ background: var(--accent); color:#fff; border-color: var(--accent); }
  .theme-toggle.active:hover{ color:#fff; opacity:0.9; }

  .date-row{
    display:flex; align-items:center; gap:14px; flex-wrap: wrap; margin-bottom: 26px;
  }
  .date-label{ font-size: 13.5px; color: var(--text-muted); }
  .date-label b{ color: var(--text); font-weight:700; }

  .date-nav{
    display:flex; align-items:center; gap:6px; background: var(--surface);
    border:1px solid var(--hairline); border-radius:999px; padding:4px;
    box-shadow: var(--shadow); position: relative;
  }
  .nav-arrow{
    width:26px; height:26px; border-radius:50%; border:none;
    background: transparent; color: var(--text); font-size:15px; line-height:1;
    cursor:pointer; display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
  }
  .nav-arrow:hover:not(:disabled){ background: var(--accent-soft); color: var(--accent); }
  .nav-arrow:disabled{ opacity:0.3; cursor:default; }

  .cal-wrap{ position: relative; }
  .date-trigger{
    display:flex; align-items:center; gap:5px;
    font-family:"Pretendard",sans-serif; font-size:12.5px; font-weight:600;
    color: var(--text); background:transparent; border:none; outline:none;
    padding:6px 8px; border-radius:999px; cursor:pointer;
  }
  .date-trigger:hover{ background: var(--accent-soft); color: var(--accent); }
  .date-trigger svg{ flex-shrink:0; transition: transform 0.15s; }
  .date-trigger[aria-expanded="true"] svg{ transform: rotate(180deg); }

  .calendar-popover{
    position:absolute; top: calc(100% + 8px); left:50%; transform: translateX(-50%);
    background: var(--surface-solid); border:1px solid var(--hairline); border-radius:16px;
    box-shadow: 0 16px 40px rgba(80,60,110,0.16); padding:14px; width:264px; z-index:20;
  }
  .cal-header{ display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .cal-month-label{ font-size:13px; font-weight:700; }
  .cal-nav-btn{
    width:24px; height:24px; border-radius:50%; border:none; background:transparent;
    color: var(--text); font-size:14px; cursor:pointer; display:flex; align-items:center; justify-content:center;
  }
  .cal-nav-btn:hover:not(:disabled){ background: var(--accent-soft); color: var(--accent); }
  .cal-nav-btn:disabled{ opacity:0.25; cursor:default; }

  .cal-weekdays{ display:grid; grid-template-columns: repeat(7, 1fr); margin-bottom:2px; }
  .cal-weekdays span{ text-align:center; font-size:10px; color: var(--text-muted); font-weight:600; padding:4px 0; }

  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:2px; }
  .cal-day{
    width:100%; aspect-ratio:1; border-radius:50%; border:none; background:transparent;
    font-family:"Pretendard",sans-serif; font-size:11.5px; color: var(--text-muted);
    cursor:default; display:flex; align-items:center; justify-content:center;
  }
  .cal-day.empty{ visibility:hidden; }
  .cal-day.has-data{ color: var(--text); font-weight:600; cursor:pointer; background: var(--accent-soft); }
  .cal-day.has-data:hover{ background: var(--accent); color:#fff; }
  .cal-day.selected{ background: var(--accent) !important; color:#fff !important; }
  .cal-day:disabled:not(.has-data){ opacity:0.35; }

  .board{ display:grid; grid-template-columns: repeat(3, 1fr); gap: 18px; align-items: start; }
  @media (max-width: 860px){ .board{ grid-template-columns: 1fr; } }

  .column-head{
    display:flex; align-items:center; gap:9px; margin-bottom:14px; padding: 0 4px;
  }
  .dot{ width:9px; height:9px; border-radius:50%; flex-shrink:0; }
  .dot.kakao{ background: var(--kakao-head); }
  .dot.ridi{ background: var(--ridi-head); }
  .dot.naver{ background: var(--naver-head); }
  .column-title{ font-weight:700; font-size:14.5px; }
  .column-count{
    margin-left:auto; font-size:11.5px; color: var(--text-muted);
    background: var(--surface); border:1px solid var(--hairline);
    padding: 2px 9px; border-radius: 999px;
  }

  .card-list{ display:flex; flex-direction:column; gap:10px; }

  .card{
    background: var(--surface-solid);
    border: 1px solid var(--hairline);
    border-radius: 18px;
    padding: 14px 15px;
    box-shadow: var(--shadow);
  }
  .card-top{ display:flex; align-items:center; gap:9px; margin-bottom:9px; }
  .rank-badge{
    width:26px; height:26px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-num); font-weight:800; font-size:12px;
    flex-shrink:0; color: var(--text);
  }
  .rank-badge.kakao{ background: var(--kakao-tint); color: var(--kakao-text); }
  .rank-badge.ridi{ background: var(--ridi-tint); color: var(--ridi-text); }
  .rank-badge.naver{ background: var(--naver-tint); color: var(--naver-text); }
  .card-launch{ margin-left:auto; font-size:10.5px; color: var(--text-muted); white-space:nowrap; }
  .card-external{
    flex-shrink:0; width:20px; height:20px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:11px; color: var(--text-muted); background: var(--accent-soft);
  }
  .card-external:hover{ color: var(--accent); }

  .card-title{
    font-weight:700; font-size:14.5px; margin-bottom:3px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;
  }
  .card-title:hover{ color: var(--accent); }
  .card-author{ font-size:12px; color: var(--text-muted); margin-bottom:10px; }

  .chip-row{ display:flex; flex-wrap:wrap; gap:5px; margin-bottom: 10px; }
  .chip{ font-size:10.5px; padding:2px 8px; border-radius:999px; font-weight:600; }
  .chip.kakao{ background: var(--kakao-tint); color: var(--kakao-text); }
  .chip.ridi{ background: var(--ridi-tint); color: var(--ridi-text); }
  .chip.naver{ background: var(--naver-tint); color: var(--naver-text); }

  .spark-row{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
  .spark-row svg{ flex:1; min-width:0; }
  .delta{ font-family: var(--font-num); font-size:10.5px; font-weight:700; white-space:nowrap; flex-shrink:0; }
  .delta.up{ color:#34D399; }
  .delta.down{ color:#F87171; }
  .delta.neutral{ color: var(--text-muted); }
  .delta.chip{ font-size:12px; padding:3px 10px; border-radius:999px; }
  .delta.chip.up{ background: rgba(52,211,153,0.14); }
  .delta.chip.down{ background: rgba(248,113,113,0.14); }
  .delta.chip.neutral{ background: var(--accent-soft); }

  .card-footer{
    display:flex; align-items:center; justify-content:space-between;
    padding-top: 9px; border-top: 1px solid var(--hairline);
  }
  .metric-value{ font-family: var(--font-num); font-weight:800; font-size:13.5px; }
  .metric-type{ font-size:10.5px; color: var(--text-muted); }

  .empty-col{
    border: 1.5px dashed var(--hairline); border-radius:18px; padding: 34px 16px;
    text-align:center; font-size:12.5px; color: var(--text-muted); background: rgba(255,255,255,0.4);
  }
  .empty-state{
    grid-column: 1 / -1;
    border: 1.5px dashed var(--hairline); border-radius:18px; padding: 60px 24px;
    text-align:center; font-size:14px; color: var(--text-muted); background: rgba(255,255,255,0.5);
  }
  .empty-state code{
    background: var(--accent-soft); padding:2px 6px; border-radius:4px; font-size:12.5px;
  }

  a:focus-visible, button:focus-visible, input:focus-visible{
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce){ *{ transition:none !important; } }

  /* 상세 페이지 */
  .back-btn{
    display:inline-flex; align-items:center; gap:6px;
    background: var(--surface); border:1px solid var(--hairline);
    border-radius:999px; padding:8px 14px; font-size:12.5px; font-weight:600;
    color: var(--text); cursor:pointer; margin-bottom:20px; box-shadow: var(--shadow);
  }
  .back-btn:hover{ color: var(--accent); }

  .detail-head{ display:flex; align-items:center; gap:9px; margin-bottom:10px; }
  .detail-title{
    font-family:"Manrope",sans-serif; font-weight:800; font-size: clamp(20px,3.4vw,28px);
    margin: 0 0 4px;
  }
  .detail-author{ font-size:13.5px; color: var(--text-muted); margin-bottom:10px; }
  .detail-original-link{
    display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:600;
    color: var(--accent); background: var(--accent-soft); border-radius:999px;
    padding:6px 13px; margin-bottom:20px;
  }
  .detail-original-link:hover{ opacity:0.8; }

  .hero-stat{ display:flex; align-items:baseline; gap:10px; margin-bottom:22px; flex-wrap:wrap; }
  .hero-value{ font-family: var(--font-num); font-weight:800; font-size:30px; letter-spacing:-0.01em; }
  .hero-sublabel{ font-size:11px; color: var(--text-muted); }

  .chart-card{
    background: var(--surface-solid); border:1px solid var(--hairline); border-radius:20px;
    padding:20px 18px 12px; box-shadow: var(--shadow); margin-bottom:22px;
  }
  .chart-title{ font-size:12.5px; color: var(--text-muted); margin-bottom:12px; }
  .chart-card svg text{ font-family:"Pretendard",sans-serif; }

  .history-table{ width:100%; border-collapse:collapse; background: var(--surface-solid);
    border:1px solid var(--hairline); border-radius:16px; overflow:hidden; box-shadow: var(--shadow); }
  .history-table th, .history-table td{ padding:10px 14px; text-align:left; font-size:12.5px; }
  .history-table thead th{ color: var(--text-muted); font-weight:600; font-size:11px;
    border-bottom:1px solid var(--hairline); }
  .history-table tbody tr:not(:last-child) td{ border-bottom:1px solid var(--hairline); }
  .history-table td:nth-child(2), .history-table th:nth-child(2){ text-align:center; }
  .history-table td:nth-child(3), .history-table th:nth-child(3){ text-align:right; font-weight:600; }

  /* 인사이트 화면 */
  .insight-header{ margin-bottom:22px; }
  .insight-title{ font-family:"Manrope",sans-serif; font-weight:800; font-size:22px; margin:0 0 4px; }
  .insight-sub{ font-size:12.5px; color: var(--text-muted); }

  .insight-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:18px; margin-bottom:18px; }
  @media (max-width: 780px){ .insight-grid{ grid-template-columns: 1fr; } }

  .insight-card{
    background: var(--surface-solid); border:1px solid var(--hairline); border-radius:18px;
    padding:18px 18px 14px; box-shadow: var(--shadow);
  }
  .insight-card-head{ display:flex; align-items:center; gap:8px; margin-bottom:14px; }
  .insight-card-title{ font-weight:700; font-size:14.5px; }
  .insight-card-icon{ font-size:15px; }
  .insight-card-empty{ font-size:12.5px; color: var(--text-muted); padding:18px 0; text-align:center; }

  .ins-row{
    display:flex; align-items:center; gap:10px; padding:8px 0;
    border-bottom:1px solid var(--hairline); font-size:12.5px;
  }
  .ins-row:last-child{ border-bottom:none; }
  .ins-row .chip{ flex-shrink:0; }
  .ins-row .ins-title{
    flex:1; min-width:0; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
    text-decoration:none; color: var(--text);
  }
  .ins-row .ins-title:hover{ color: var(--accent); }
  .ins-row .ins-meta{ flex-shrink:0; font-size:11px; color: var(--text-muted); }
  .ins-row .delta{ flex-shrink:0; font-size:11.5px; }
  .ins-row .streak-badge{
    flex-shrink:0; font-family: var(--font-num); font-weight:700; font-size:11.5px;
    color: var(--text); background: var(--accent-soft); padding:2px 8px; border-radius:999px;
  }

  .ins-group{ margin-bottom:14px; }
  .ins-group:last-child{ margin-bottom:0; }
  .ins-group-head{ display:flex; align-items:center; gap:7px; margin-bottom:4px; }
  .ins-group-title{ font-size:11.5px; font-weight:700; color: var(--text-muted); }

  .kw-row{ display:flex; align-items:center; gap:10px; padding:6px 0; font-size:12.5px; }
  .kw-label{ width:120px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .kw-bar-track{ flex:1; height:8px; border-radius:999px; background: var(--accent-soft); overflow:hidden; }
  .kw-bar-fill{ height:100%; background: var(--accent); border-radius:999px; }
  .kw-count{ width:28px; flex-shrink:0; text-align:right; font-family: var(--font-num); font-weight:700; font-size:11.5px; color: var(--text-muted); }

  .insight-full{ grid-column: 1 / -1; }
</style>
</head>
<body>
<div class="page">

<header class="topbar">
  <div class="brand">
    <div class="brand-icon">📖</div>
    <div>
      <div class="brand-title">웹소설 랭킹 보드</div>
      <div class="brand-sub">카카오페이지 · 리디북스 · 네이버시리즈 로맨스 TOP15</div>
    </div>
  </div>
  <div class="view-nav">
    <a href="#/" class="pill" id="navBoard">보드</a>
    <a href="#/insights" class="pill" id="navInsights">인사이트</a>
    <a href="#/romance" class="pill" id="navRomance">매일10시무료 로맨스 신작</a>
  </div>
  <div class="search-box">
    <svg width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M13.28 8.18a5.1 5.1 0 1 1-10.2 0 5.1 5.1 0 0 1 10.2 0m-1.031 5.069a6.5 6.5 0 1 1 .991-.989l4.695 4.695a.7.7 0 1 1-.99.99z" fill="currentColor"/>
    </svg>
    <input type="text" id="searchInput" placeholder="작품명 · 작가명 · 키워드 검색" autocomplete="off">
    <div class="search-results" id="searchResults" hidden></div>
  </div>
  <button type="button" class="theme-toggle" id="exportBtn" aria-label="현재 화면 CSV로 내보내기" title="현재 화면 CSV로 내보내기">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 19h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
  <button type="button" class="theme-toggle" id="trendToggle" aria-label="추이 그래프 표시 전환" title="추이 그래프 표시/숨김">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M3 17l5-5 4 3 6-7 3 3" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

<script>
// 저장된 테마를 최대한 빨리 적용해서, 밝은 테마가 잠깐 번쩍이는 걸 방지한다.
(function initTheme(){

  if (saved === "dark") document.documentElement.setAttribute("data-theme", "dark");
})();

function applyThemeIcons(){
  const isDark = isDarkTheme();
  document.getElementById("themeIconSun").style.display = isDark ? "none" : "block";
  document.getElementById("themeIconMoon").style.display = isDark ? "block" : "none";
}

function toggleTheme(){
  const next = isDarkTheme() ? "" : "dark";
  if (next){
    document.documentElement.setAttribute("data-theme", "dark");
  } else {
    document.documentElement.removeAttribute("data-theme");
  }

  applyThemeIcons();
  renderBoard();

    const hash = location.hash;
    if (hash.startsWith("#/work/")) renderDetailView(decodeURIComponent(hash.slice("#/work/".length)));

}

function applyTrendToggleUI(){
  document.getElementById("trendToggle").classList.toggle("active", state.showTrend);
}

function toggleTrend(){
  state.showTrend = !state.showTrend;
  localStorage.setItem("showTrend", state.showTrend ? "1" : "0");
  applyTrendToggleUI();
  renderBoard();
}

const CSV_PATH = "output/webnovel_ranking.csv";
const ROMANCE_CSV_PATH = "output/naver_dailyfree_romance_new.csv";
const PLATFORMS = [
  { name: "카카오페이지", cls: "kakao" },
  { name: "리디북스", cls: "ridi" },
  { name: "네이버시리즈", cls: "naver" }
];

let allRows = [];
let romanceRows = [];
let dateValues = [];
let dateSet = new Set();
let romanceDateValues = [];
let state = { date: null, query: "", viewYM: null, showTrend: true, romanceDate: null };

function escapeHtml(str){
  return String(str ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[c]));
}

function formatDateLabel(dateStr){
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00+09:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${d.getFullYear()}년 ${d.getMonth() + 1}월 ${d.getDate()}일 ${days[d.getDay()]}요일`;
}

function formatDateShort(dateStr){
  if (!dateStr) return "";
  const d = new Date(dateStr + "T00:00:00+09:00");
  const days = ["일", "월", "화", "수", "목", "금", "토"];
  return `${dateStr} (${days[d.getDay()]})`;
}

function pad2(n){ return String(n).padStart(2, "0"); }

function addMonths(ym, delta){
  let [y, m] = ym.split("-").map(Number);
  m += delta;
  while (m > 12){ m -= 12; y += 1; }
  while (m < 1){ m += 12; y -= 1; }
  return `${y}-${pad2(m)}`;
}

function renderDateNav(){
  const prevBtn = document.getElementById("datePrev");
  const nextBtn = document.getElementById("dateNext");

  document.getElementById("dateTriggerText").textContent = state.date
    ? formatDateShort(state.date)

  const idx = dateValues.indexOf(state.date);
  prevBtn.disabled = idx === -1 || idx >= dateValues.length - 1; // 더 이전 날짜 없음
  nextBtn.disabled = idx <= 0; // 더 최신 날짜 없음

function minMaxYM(){

function renderCalendarPopover(){
  const [vy, vm] = state.viewYM.split("-").map(Number);
  document.getElementById("calMonthLabel").textContent = `${vy}년 ${vm}월`;

  const firstWeekday = new Date(vy, vm - 1, 1).getDay();

    cells += `<span class="cal-day empty"></span>`;
  }
  for (let day = 1; day <= totalDays; day++){

    const isSelected = dateStr === state.date;
    cells += `<button type="button" class="cal-day${hasData ? " has-data" : ""}${isSelected ? " selected" : ""}"
      data-date="${dateStr}"${hasData ? "" : " disabled"}>${day}</button>`;

  document.querySelectorAll("#calGrid .cal-day.has-data").forEach((btn) => {

      state.date = btn.dataset.date;

      renderBoard();

  document.getElementById("calPrevMonth").disabled = !min || state.viewYM <= min;

}

function openCalendar(){

function toggleCalendar(){

function isDarkTheme(){

/**
 * 해당 작품의 uptoDate 기준까지의 기록에서, 마지막 값과 그 이전 값을 비교해
 * 전일(정확히는 "그 전 수집일") 대비 등락률과, 미니 스파크라인용 최근 값 목록을 만든다.
 */
function computeTrend(url, uptoDate){
  const hist = getWorkHistory(url).filter((h) => h.date <= uptoDate);
  const last = hist[hist.length - 1];
  const prev = hist[hist.length - 2];
  const deltaPct =
    last && prev && last.value != null && prev.value != null && prev.value !== 0
      ? ((last.value - prev.value) / prev.value) * 100
      : null;
  return { points: hist.slice(-7).map((h) => h.value), deltaPct };
}

function buildSparkline(values, color){
  const nums = values.filter((v) => v != null);
  if (nums.length < 2) return "";
  const width = 100, height = 24;
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = max - min || 1;
  const step = width / (nums.length - 1);
  const pts = nums.map((v, i) => `${(i * step).toFixed(1)},${(height - ((v - min) / range) * height).toFixed(1)}`).join(" ");
  return `<svg viewBox="0 0 ${width} ${height}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2"/></svg>`;
}

function deltaBadgeHtml(deltaPct, chip){
  const cls = chip ? "delta chip" : "delta";
  if (deltaPct == null) return `<span class="${cls} neutral">NEW</span>`;
  const isUp = deltaPct >= 0;
  return `<span class="${cls} ${isUp ? "up" : "down"}">${isUp ? "▲" : "▼"} ${Math.abs(deltaPct).toFixed(1)}%</span>`;
}

function cardHtml(r, cls){
  const rank = Number(r["순위"]);
  const url = r["URL"] || "";
  // 네이버시리즈는 카드에선 키워드를 숨기고, 상세페이지에서만 보여준다 (요청 반영).
  const keywords = cls === "naver" ? [] : (r["키워드"] || "").split(/\s+/).filter(Boolean).slice(0, 3);
  const chipRow = keywords.length
    ? `<div class="chip-row">${keywords.map((k) => `<span class="chip ${cls}">${escapeHtml(k)}</span>`).join("")}</div>`
    : "";

  // 다크 모드에서만 전일 대비 등락 + 스파크라인을 보여준다 (요청 반영: 파스텔 모드는 기존 그대로 유지).
  let sparkRow = "";
  if (state.showTrend && url){
    const { points, deltaPct } = computeTrend(url, r["확인날짜"]);
    const sparkColor = deltaPct == null ? "#6B7690" : deltaPct >= 0 ? "#34D399" : "#F87171";
    const sparkSvg = buildSparkline(points, sparkColor);
    sparkRow = `<div class="spark-row">${deltaBadgeHtml(deltaPct, false)}${sparkSvg}</div>`;
  }

  return `
    <div class="card">
      <div class="card-top">
        <div class="rank-badge ${cls}">${rank}</div>
        <div class="card-launch">${escapeHtml(r["론칭일"]) || "론칭일 미상"}</div>
        <a class="card-external" href="${escapeHtml(url)}" target="_blank" rel="noopener" title="원본 페이지에서 보기" aria-label="원본 페이지에서 보기">↗</a>
      </div>
      <a class="card-title" href="#/work/${encodeURIComponent(url)}">${escapeHtml(r["작품명"])}</a>
      <div class="card-author">${escapeHtml(r["작가명"]) || "작가 미상"}</div>
      ${chipRow}
      ${sparkRow}
      <div class="card-footer">
        <span class="metric-value">${escapeHtml(r["지표값"]) || "—"}</span>
        <span class="metric-type">${escapeHtml(r["지표종류"])}</span>
      </div>
    </div>`;
}

function renderBoard(){
  const wrap = document.getElementById("boardWrap");

  if (!allRows.length){

/**
 * 매일10시무료 로맨스 신작 카드. TOP15와 스키마가 달라(순위 없음, 별점/댓글수/다운로드수

function romanceCardHtml(r){

        <span class="metric-type">댓글</span>

function renderRomanceBoard(){
  const wrap = document.getElementById("romanceWrap");

  if (!romanceRows.length){
    wrap.innerHTML = `
      <div class="board">
        <div class="empty-state">
          아직 표시할 데이터가 없습니다.<br>

          (GitHub Actions가 최소 한 번은 실행되어야 이 파일이 생깁니다.)

  }

  const q = state.query.trim().toLowerCase();
  let rows = romanceRows.filter((r) => r["확인날짜"] === state.romanceDate);
  if (q){
    rows = rows.filter((r) =>
      (r["작품명"] || "").toLowerCase().includes(q) ||
      (r["작가명"] || "").toLowerCase().includes(q) ||
      (r["키워드"] || "").toLowerCase().includes(q)
    );
  }
  // 다운로드수 내림차순 정렬 (순위 컬럼이 없는 데이터셋이라 다운로드수로 대신 정렬)
  rows.sort((a, b) => {
    const av = parseMetricNumber("네이버시리즈", a["다운로드수"]) ?? -1;
    const bv = parseMetricNumber("네이버시리즈", b["다운로드수"]) ?? -1;

    ? `<div class="card-list">${rows.map((r) => romanceCardHtml(r)).join("")}</div>`

        </div>
        ${body}
      </div>
    </div>`;
}

const CHART_COLOR_LIGHT = { kakao: "#C99A2E", ridi: "#3E7FA6", naver: "#4C9A5B" };
const CHART_COLOR_DARK = { kakao: "#F0B429", ridi: "#22D3EE", naver: "#34D399" };

function chartColorFor(cls){
  const map = isDarkTheme() ? CHART_COLOR_DARK : CHART_COLOR_LIGHT;
  return map[cls] || (isDarkTheme() ? "#5B8DEF" : "#8D86CE");
}

/**
 * "1,234,567" / "19.5만" / "4.7(3,063)" 같은 지표값 문자열에서
 * 그래프에 쓸 숫자를 뽑아낸다. 리디북스는 괄호 안 리뷰수를 사용한다
 * (별점은 0~5 범위라 추이 그래프에 안 맞아서, 리뷰수 증가로 대체).
 */
function parseMetricNumber(platform, raw){
  if (!raw) return null;
  if (platform === "리디북스"){
    const m = raw.match(/\(([\d,]+)\)/);
    return m ? Number(m[1].replace(/,/g, "")) : null;
  }
  const manMatch = raw.match(/^([\d.,]+)\s*만$/);
  if (manMatch) return Math.round(parseFloat(manMatch[1].replace(/,/g, "")) * 10000);
  const eokMatch = raw.match(/^([\d.,]+)\s*억$/);
  if (eokMatch) return Math.round(parseFloat(eokMatch[1].replace(/,/g, "")) * 100000000);
  const plain = Number(raw.replace(/,/g, ""));
  return Number.isFinite(plain) ? plain : null;
}

function chartYLabel(platform){
  return platform === "리디북스" ? "리뷰수" : (platform === "네이버시리즈" ? "다운로드수" : "뷰수");
}

function buildLineChartSvg(points, color){
  const width = 640, height = 220;
  const pad = { top: 16, right: 16, bottom: 26, left: 46 };
  const innerW = width - pad.left - pad.right;
  const innerH = height - pad.top - pad.bottom;

  const values = points.map((p) => p.value).filter((v) => v != null);
  if (!values.length){
    return `<div class="empty-col">그래프로 그릴 숫자 데이터가 없습니다.</div>`;
  }
  const minV = Math.min(...values, 0);
  const maxV = Math.max(...values);
  const rangeV = maxV - minV || 1;

  const n = points.length;
  const xAt = (i) => pad.left + (n === 1 ? innerW / 2 : (innerW * i) / (n - 1));
  const yAt = (v) => pad.top + innerH - ((v - minV) / rangeV) * innerH;

  const withXY = points.map((p, i) => ({ ...p, cx: xAt(i), cy: p.value != null ? yAt(p.value) : null }));

  const pathD = withXY
    .filter((p) => p.cy != null)
    .map((p, idx) => `${idx === 0 ? "M" : "L"} ${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`)
    .join(" ");

  const gridVals = [minV, (minV + maxV) / 2, maxV];
  const grid = gridVals.map((v) => {
    const yy = yAt(v);
    return `<line x1="${pad.left}" y1="${yy.toFixed(1)}" x2="${width - pad.right}" y2="${yy.toFixed(1)}" stroke="var(--hairline)" stroke-width="1" />
      <text x="${pad.left - 8}" y="${(yy + 3.5).toFixed(1)}" text-anchor="end" font-size="10" fill="var(--text-muted)">${Math.round(v).toLocaleString()}</text>`;
  }).join("");

  const step = Math.max(1, Math.ceil(n / 6));
  const dateLabels = withXY.map((p, i) => {
    if (i !== 0 && i !== n - 1 && i % step !== 0) return "";
    return `<text x="${p.cx.toFixed(1)}" y="${height - 8}" text-anchor="middle" font-size="9" fill="var(--text-muted)">${escapeHtml(p.date.slice(5))}</text>`;
  }).join("");

  const dots = withXY.filter((p) => p.cy != null).map((p) =>
    `<circle cx="${p.cx.toFixed(1)}" cy="${p.cy.toFixed(1)}" r="3.5" fill="${color}"><title>${escapeHtml(p.date)} · ${p.value.toLocaleString()}</title></circle>`
  ).join("");

  const validPoints = withXY.filter((p) => p.cy != null);
  const baseline = height - pad.bottom;
  const areaPath = validPoints.length > 1
    ? `M ${validPoints[0].cx.toFixed(1)} ${baseline} ` +
      validPoints.map((p) => `L ${p.cx.toFixed(1)} ${p.cy.toFixed(1)}`).join(" ") +
      ` L ${validPoints[validPoints.length - 1].cx.toFixed(1)} ${baseline} Z`
    : "";

  return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="220" role="img">
    <defs>
      <linearGradient id="chartAreaFill" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${color}" stop-opacity="0.25"/>
        <stop offset="100%" stop-color="${color}" stop-opacity="0"/>
      </linearGradient>
    </defs>
    ${grid}
    <path d="${areaPath}" fill="url(#chartAreaFill)" stroke="none" />
    <path d="${pathD}" fill="none" stroke="${color}" stroke-width="2.5" />
    ${dots}
    ${dateLabels}
  </svg>`;
}

function clsOf(platformName){

/**
 * 검색창 드롭다운용: 작품(URL 기준)별로 가장 최근 체크 데이터 한 건만 남긴다.
 * (같은 작품이 날짜마다 여러 행으로 쌓여있으므로, 검색 결과에는 최신 상태만 보여준다.)
 * TOP15(allRows)와 매일10시무료 로맨스 신작(romanceRows) 둘 다 검색 대상에 포함하고,
 * 나중에 어느 상세페이지로 보낼지 구분할 수 있도록 각 항목에 _kind를 붙인다.
 */
function dedupedWorksForSearch(){
  const byUrl = new Map();
  for (const r of allRows){
    const url = r["URL"] || "";
    const key = `top15::${url || r["플랫폼"] + "::" + r["작품명"]}`;
    const prev = byUrl.get(key);
    if (!prev || (r["확인날짜"] || "") > (prev["확인날짜"] || "")){
      byUrl.set(key, { ...r, _kind: "top15" });
    }
  }
  for (const r of romanceRows){
    const url = r["URL"] || "";
    const key = `romance::${url || r["작품명"]}`;
    const prev = byUrl.get(key);
    if (!prev || (r["확인날짜"] || "") > (prev["확인날짜"] || "")){
      byUrl.set(key, { ...r, _kind: "romance", "플랫폼": "네이버시리즈" });
    }
  }
  return [...byUrl.values()];
}

function searchMatches(query){
  const q = query.trim().toLowerCase();
  if (!q) return [];
  const works = dedupedWorksForSearch();
  const matched = works.filter((r) =>
    (r["작품명"] || "").toLowerCase().includes(q) ||
    (r["작가명"] || "").toLowerCase().includes(q) ||
    (r["키워드"] || "").toLowerCase().includes(q)
  );
  matched.sort((a, b) => {
    const aStarts = (a["작품명"] || "").toLowerCase().startsWith(q) ? 0 : 1;
    const bStarts = (b["작품명"] || "").toLowerCase().startsWith(q) ? 0 : 1;
    if (aStarts !== bStarts) return aStarts - bStarts;
    return (b["확인날짜"] || "").localeCompare(a["확인날짜"] || "");
  });
  return matched.slice(0, 20);
}

function rowsForDate(date){
  return allRows.filter((r) => r["확인날짜"] === date);
}

/**
 * 오늘(state.date) 대비 바로 이전 수집일 사이의 신규 진입 / 이탈 작품을 플랫폼별로 계산.
 * 비교할 이전 날짜가 없으면(가장 오래된 날짜일 때) null 반환.
 */
function computeNewDropped(){
  const idx = dateValues.indexOf(state.date);
  if (idx === -1 || idx >= dateValues.length - 1) return null;
  const prevDate = dateValues[idx + 1];
  const todayRows = rowsForDate(state.date);
  const prevRows = rowsForDate(prevDate);

  const result = {};
  PLATFORMS.forEach(({ name }) => {
    const todayMap = new Map(todayRows.filter((r) => r["플랫폼"] === name).map((r) => [r["URL"], r]));
    const prevMap = new Map(prevRows.filter((r) => r["플랫폼"] === name).map((r) => [r["URL"], r]));
    const newEntries = [...todayMap.entries()].filter(([u]) => !prevMap.has(u)).map(([, r]) => r);
    const dropped = [...prevMap.entries()].filter(([u]) => !todayMap.has(u)).map(([, r]) => r);
    newEntries.sort((a, b) => Number(a["순위"]) - Number(b["순위"]));
    dropped.sort((a, b) => Number(a["순위"]) - Number(b["순위"]));
    result[name] = { newEntries, dropped };
  });
  return { prevDate, byPlatform: result };
}

/** 오늘(state.date) 기준, 전일 대비 지표 증가율이 높은 순으로 플랫폼별 상위 5개씩 정렬. */
function computeGrowthRanking(){
  const todayRows = rowsForDate(state.date);
  const result = {};
  PLATFORMS.forEach(({ name }) => {
    const withDelta = todayRows
      .filter((r) => r["플랫폼"] === name)
      .map((r) => ({ row: r, deltaPct: computeTrend(r["URL"], state.date).deltaPct }))
      .filter((x) => x.deltaPct != null);
    withDelta.sort((a, b) => b.deltaPct - a.deltaPct);
    result[name] = withDelta.slice(0, 5);
  });
  return result;
}

/** url이 uptoDate로부터 거슬러 올라가며 며칠 연속으로 TOP15에 있었는지 계산. */
function computeStreak(url, uptoDate, urlSetsByDate){
  const idx = dateValues.indexOf(uptoDate);
  if (idx === -1) return 0;
  let streak = 0;
  for (let i = idx; i < dateValues.length; i++){
    const set = urlSetsByDate.get(dateValues[i]);
    if (set && set.has(url)) streak++;
    else break;
  }
  return streak;
}

/** 오늘(state.date) 기준, 연속 진입일이 긴 순으로 플랫폼별 상위 5개씩 정렬 (2일 이상만). */
function computeStreakRanking(){
  const urlSetsByDate = new Map(
    dateValues.map((d) => [d, new Set(rowsForDate(d).map((r) => r["URL"]))])
  );
  const todayRows = rowsForDate(state.date);
  const result = {};
  PLATFORMS.forEach(({ name }) => {
    const withStreak = todayRows
      .filter((r) => r["플랫폼"] === name)
      .map((r) => ({ row: r, streak: computeStreak(r["URL"], state.date, urlSetsByDate) }))
      .filter((x) => x.streak >= 2);
    withStreak.sort((a, b) => b.streak - a.streak);
    result[name] = withStreak.slice(0, 5);
  });
  return result;
}

/** 최근 N개 수집일(state.date 포함, 과거 방향) 동안의 키워드 등장 빈도 상위 12개. */
function computeKeywordTrend(windowSize){
  const idx = dateValues.indexOf(state.date);
  if (idx === -1) return { entries: [], rangeCount: 0 };
  const rangeDates = dateValues.slice(idx, idx + windowSize);
  const rangeSet = new Set(rangeDates);
  const counts = new Map();
  allRows.forEach((r) => {
    if (!rangeSet.has(r["확인날짜"])) return;
    (r["키워드"] || "").split(/\s+/).filter(Boolean).forEach((k) => {
      counts.set(k, (counts.get(k) || 0) + 1);
    });
  });
  const entries = [...counts.entries()].sort((a, b) => b[1] - a[1]).slice(0, 12);
  return { entries, rangeCount: rangeDates.length };
}

function renderPlatformGroups(groupedData, rowRenderer, emptyPerPlatformMsg, emptyAllMsg){
  const hasAny = PLATFORMS.some(({ name }) => groupedData[name] && groupedData[name].length);
  if (!hasAny) return `<div class="insight-card-empty">${emptyAllMsg}</div>`;

  return PLATFORMS.map(({ name, cls }) => {
    const items = groupedData[name] || [];
    const body = items.length
      ? items.map(rowRenderer).join("")
      : `<div class="insight-card-empty" style="padding:8px 0;">${emptyPerPlatformMsg}</div>`;
    return `
      <div class="ins-group">

        ${body}
      </div>`;
  }).join("");
}

function renderInsights(){
  const container = document.getElementById("insightsView");

  if (!allRows.length || !state.date){
    container.innerHTML = `<div class="empty-state">아직 표시할 데이터가 없습니다.</div>`;
    return;
  }

  // 급상승 TOP (플랫폼별)
  const growth = computeGrowthRanking();
  const growthHtml = renderPlatformGroups(
    growth,
    ({ row, deltaPct }) => insRowNoChip(row, deltaBadgeHtml(deltaPct, false)),
    "비교할 이전 데이터가 없습니다",
    "비교할 이전 수집일이 없습니다"
  );

  // 롱런 지수 (플랫폼별)
  const streakGroups = computeStreakRanking();
  const streakHtml = renderPlatformGroups(
    streakGroups,
    ({ row, streak }) => insRowNoChip(row, `<span class="streak-badge">${streak}일째</span>`),
    "2일 이상 연속 진입한 작품이 없습니다",
    "2일 이상 연속 진입한 작품이 아직 없습니다"
  );

  // 키워드 트렌드
  const windowSize = 7;
  const { entries: keywordEntries, rangeCount } = computeKeywordTrend(windowSize);
  const maxCount = keywordEntries.length ? keywordEntries[0][1] : 1;
  const keywordHtml = keywordEntries.length
    ? keywordEntries.map(([kw, count]) => `
        <div class="kw-row">
          <span class="kw-label">${escapeHtml(kw)}</span>
          <span class="kw-bar-track"><span class="kw-bar-fill" style="width:${Math.max(6, (count / maxCount) * 100)}%"></span></span>
          <span class="kw-count">${count}</span>
        </div>`).join("")
    : `<div class="insight-card-empty">최근 기간에 키워드 데이터가 없습니다 (리디북스·네이버시리즈만 수집됩니다)</div>`;

  // 신규 진입 / 이탈
  const nd = computeNewDropped();
  const newDroppedHtml = PLATFORMS.map(({ name, cls }) => {
    if (!nd){
      return `
        <div class="insight-card">
          <div class="insight-card-head"><span class="dot ${cls}"></span><span class="insight-card-title">${name}</span></div>
          <div class="insight-card-empty">비교할 이전 날짜가 없습니다</div>
        </div>`;
    }
    const { newEntries, dropped } = nd.byPlatform[name];
    const newRows = newEntries.map((r) => insCardHtml(r, `<span class="delta up">NEW · ${r["순위"]}위</span>`)).join("");
    const droppedRows = dropped.map((r) => `
      <div class="ins-row">
        <span class="chip ${cls}">${escapeHtml(name)}</span>
        <span class="ins-title" style="cursor:default;">${escapeHtml(r["작품명"])}</span>
        <span class="delta down">OUT · 전일 ${r["순위"]}위</span>
      </div>`).join("");
    const body = newRows + droppedRows;
    return `
      <div class="insight-card">
        <div class="insight-card-head"><span class="dot ${cls}"></span><span class="insight-card-title">${name}</span></div>
        ${body || `<div class="insight-card-empty">변동 없음</div>`}
      </div>`;
  }).join("");

  container.innerHTML = `
    <div class="insight-header">
      <h1 class="insight-title">인사이트</h1>
      <p class="insight-sub">기준일 ${escapeHtml(state.date)} · 보드 화면에서 날짜를 바꾸면 여기도 같이 바뀝니다</p>
    </div>

    <div class="insight-grid">
      <div class="insight-card">
        <div class="insight-card-head"><span class="insight-card-icon">🚀</span><span class="insight-card-title">급상승 TOP</span></div>
        ${growthHtml}
      </div>
      <div class="insight-card">
        <div class="insight-card-head"><span class="insight-card-icon">🔥</span><span class="insight-card-title">롱런 지수 (연속 진입일)</span></div>
        ${streakHtml}
      </div>
      <div class="insight-card insight-full">
        <div class="insight-card-head"><span class="insight-card-icon">🏷️</span><span class="insight-card-title">최근 키워드 트렌드 (최근 수집일 ${rangeCount}일)</span></div>
        ${keywordHtml}
      </div>
    </div>

    <div class="insight-header" style="margin-top:8px;">
      <h2 class="insight-title" style="font-size:16px;">오늘의 신규 진입 / 이탈</h2>
    </div>
    <div class="insight-grid">
      ${newDroppedHtml}
    </div>
  `;
}

/** 현재 보드 화면에 보이는(날짜+검색어 필터가 적용된) 데이터를 CSV로 내보낸다. */
function getVisibleRows(){
  const q = state.query.trim().toLowerCase();
  let rows = allRows.filter((r) => r["확인날짜"] === state.date);
  if (q){
    rows = rows.filter((r) =>
      (r["작품명"] || "").toLowerCase().includes(q) ||
      (r["작가명"] || "").toLowerCase().includes(q) ||
      (r["키워드"] || "").toLowerCase().includes(q)
    );
  }
  rows.sort((a, b) => {
    if (a["플랫폼"] !== b["플랫폼"]) return a["플랫폼"].localeCompare(b["플랫폼"]);
    return Number(a["순위"]) - Number(b["순위"]);
  });
  return rows;
}

function exportCurrentViewCsv(){
  const rows = getVisibleRows();
  if (!rows.length){
    alert("내보낼 데이터가 없습니다. 날짜나 검색어를 확인해주세요.");
    return;
  }
  const header = ["확인날짜", "플랫폼", "순위", "작품명", "작가명", "론칭일", "지표종류", "지표값", "키워드", "URL"];
  const esc = (v) => {
    const s = String(v ?? "");
    return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  };
  const lines = [header.join(",")].concat(rows.map((r) => header.map((h) => esc(r[h])).join(",")));
  const csv = "\ufeff" + lines.join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `webnovel_ranking_${state.date || "export"}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function route(){
  const hash = location.hash;
  const header = document.querySelector(".topbar");
  const boardView = document.getElementById("boardView");
  const insightsView = document.getElementById("insightsView");
  const detailView = document.getElementById("detailView");
  const romanceView = document.getElementById("romanceView");
  const romanceDetailView = document.getElementById("romanceDetailView");

  // 모든 화면을 일단 숨기고, 라우팅된 화면 하나만 켠다.
  [boardView, insightsView, detailView, romanceView, romanceDetailView].forEach((el) => {
    el.style.display = "none";
  });

  if (hash.startsWith("#/romance/work/")){
    header.style.display = "none";
    romanceDetailView.style.display = "block";
    renderRomanceDetailView(decodeURIComponent(hash.slice("#/romance/work/".length)));
    window.scrollTo(0, 0);
  } else if (hash.startsWith("#/work/")){
    header.style.display = "none";
    detailView.style.display = "block";
    renderDetailView(decodeURIComponent(hash.slice("#/work/".length)));
    window.scrollTo(0, 0);
  } else if (hash === "#/insights"){
    header.style.display = "flex";
    insightsView.style.display = "block";
    renderInsights();
    window.scrollTo(0, 0);
  } else if (hash === "#/romance"){
    header.style.display = "flex";
    romanceView.style.display = "block";
    renderRomanceBoard();
    window.scrollTo(0, 0);
  } else {
    header.style.display = "flex";
    boardView.style.display = "block";
  }
  updateNavActive(hash);
}

window.addEventListener("hashchange", route);

function setup(){
  dateValues = [...new Set(allRows.map((r) => r["확인날짜"]))].sort().reverse();
  dateSet = new Set(dateValues);
  state.date = dateValues[0] || null;

  romanceDateValues = [...new Set(romanceRows.map((r) => r["확인날짜"]))].sort().reverse();
  state.romanceDate = romanceDateValues[0] || null;

  const savedTrend = localStorage.getItem("showTrend");
  state.showTrend = savedTrend === null ? true : savedTrend === "1";

  applyThemeIcons();
  document.getElementById("themeToggle").addEventListener("click", toggleTheme);

  applyTrendToggleUI();
  document.getElementById("trendToggle").addEventListener("click", toggleTrend);
  document.getElementById("exportBtn").addEventListener("click", exportCurrentViewCsv);

  renderDateNav();

  document.getElementById("dateTrigger").addEventListener("click", (e) => {
    e.stopPropagation();
    toggleCalendar();
  });
  document.getElementById("calPrevMonth").addEventListener("click", () => {
    state.viewYM = addMonths(state.viewYM, -1);
    renderCalendarPopover();
  });
  document.getElementById("calNextMonth").addEventListener("click", () => {
    state.viewYM = addMonths(state.viewYM, 1);
    renderCalendarPopover();
  });
  document.addEventListener("click", (e) => {
    const wrap = document.querySelector(".cal-wrap");
    if (wrap && !wrap.contains(e.target)) closeCalendar();
  });
  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") closeCalendar();
  });

  document.getElementById("datePrev").addEventListener("click", () => {
    const idx = dateValues.indexOf(state.date);
    if (idx < dateValues.length - 1){
      state.date = dateValues[idx + 1];
      renderDateNav();
      renderBoard();
    }
  });
  document.getElementById("dateNext").addEventListener("click", () => {
    const idx = dateValues.indexOf(state.date);
    if (idx > 0){
      state.date = dateValues[idx - 1];
      renderDateNav();
      renderBoard();
    }
  });

  renderRomanceDateNav();
  document.getElementById("romanceDatePrev").addEventListener("click", () => {
    const idx = romanceDateValues.indexOf(state.romanceDate);
    if (idx < romanceDateValues.length - 1){
      state.romanceDate = romanceDateValues[idx + 1];
      renderRomanceDateNav();
      renderRomanceBoard();
    }
  });
  document.getElementById("romanceDateNext").addEventListener("click", () => {
    const idx = romanceDateValues.indexOf(state.romanceDate);
    if (idx > 0){
      state.romanceDate = romanceDateValues[idx - 1];
      renderRomanceDateNav();
      renderRomanceBoard();
    }
  });

  document.getElementById("searchInput").addEventListener("input", (e) => {
    state.query = e.target.value;
    renderBoard();
    renderRomanceBoard();
    renderSearchResults();
  });
  document.getElementById("searchInput").addEventListener("focus", () => {
    if (state.query.trim()) renderSearchResults();
  });
  document.getElementById("searchInput").addEventListener("keydown", (e) => {
    if (e.key === "Escape"){
      hideSearchResults();
      return;
    }
    if (e.key === "Enter"){
      const first = searchMatches(state.query)[0];
      if (first) goToWork(first["URL"] || "", first._kind);
    }
  });
  document.addEventListener("click", (e) => {
    if (!document.querySelector(".search-box").contains(e.target)) hideSearchResults();
  });

  renderBoard();
  route();
}

Promise.all([
  fetch(CSV_PATH)
    .then((res) => {
      if (!res.ok) throw new Error("CSV fetch failed");
      return res.text();
    })
    .then((text) => Papa.parse(text, { header: true, skipEmptyLines: true }).data)
    .catch(() => []),
  fetch(ROMANCE_CSV_PATH)
    .then((res) => {
      if (!res.ok) throw new Error("Romance CSV fetch failed");
      return res.text();
    })
    .then((text) => Papa.parse(text, { header: true, skipEmptyLines: true }).data)
    .catch(() => []),
]).then(([mainData, romanceData]) => {
  allRows = mainData;
  romanceRows = romanceData;
  setup();
});
</script>
